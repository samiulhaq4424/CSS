<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Height & Width</title>
    <style>
      body { /*The whole body column is centered in the browser*/
        margin: 0 auto; /* left-right auto margins */
        width: 100px; /* must have a width */
      }
      .box {
        height: 80px;
        width: 80px;
        text-align: center;
      }
      #box1 {
        background-color: lightcoral;
      }
      #box2 {
        background-color: lightgreen;
      }
      #box3 {
        background-color: lightskyblue;
      }
    </style>
  </head>
  <body>
    <div id="box1" class="box">Box 1</div>
    <br />
    <div id="box2" class="box">Box 2</div>
    <br />
    <div id="box3" class="box">Box 3</div>
  </body>
</html>
